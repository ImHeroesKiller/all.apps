name: Verify APK catalog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify published APK metadata and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_catalog.py
